- type: entity
  id: FishMagazineScarH
  name: "SCAR-H magazine (.308)"
  parent: BaseMagazineRifleHeavy
  suffix: Fish
  abstract: true
  components:
  - type: Tag
    tags:
      - FishMagazineScarH
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeHeavyRifle
    capacity: 20
  - type: Sprite
    sprite: _Fish/Objects/Weapons/Guns/Ammunition/Magazines/scar_h.rsi
    layers:
    - state: base-0
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

