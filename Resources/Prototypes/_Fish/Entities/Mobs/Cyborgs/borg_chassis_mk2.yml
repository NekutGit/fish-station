# MK2 Sec Proto 1 Start

- type: entity
  parent: XrayLaserBeam
  id: XrayLaserBeamLight
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Heat: 9
        Radiation: 5

- type: entity
  parent: CartridgeXrayBeam
  id: CartridgeXrayBeamLight
  categories: [ HideSpawnMenu ]
  components:
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: XrayLaserBeamLight

- type: entity
  id: PlasmaBullet
  name: plasma bullet
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    layers:
    - state: xray
      shader: unshaded
    rotation: 90
    noRot: false
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_xray
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: xray
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_xray
    bullet:
      sprite:
        sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
        state: xray
  - type: HitscanBasicRaycast
    collisionMask: BulletImpassable
  - type: Projectile
    damage:
      types:
        Piercing: 4
        Heat: 6
  - type: PointLight
    enabled: true
    color: "#ae00ff"
    radius: 1.5
    energy: 35.0
  - type: IgniteOnCollide
    fireStacks: 0.05


- type: entity
  id: BulletDisablerSmgDouble
  categories: [ HideSpawnMenu ]
  parent: BulletDisablerSmgSpread
  components:
  - type: ProjectileSpread
    proto: BulletDisablerSmg
    count: 2
    spread: 5

- type: entity
  name: Borg heavy XRay weapon
  parent: WeaponEarthGovXRay
  id: WeaponXRayBorg
  suffix: Fish
  description: Borg heavy XRay weapon
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 35
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
  - type: Gun
    fireRate: 4
    minAngle: 1
    maxAngle: 2
  - type: BatteryAmmoProvider
    proto: CartridgeXrayBeamLight
    fireCost: 150

- type: entity
  name: borg hybrid taser
  parent: BaseWeaponBatterySmall
  id: WeaponAdvancedTaserBorg
  description: borg hybrid taser
  components:
  - type: Tag
    tags:
    - Taser
    - Sidearm
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Battery/adv_taser.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: disable
      map: ["enum.FireModesLayers.FireMode"]
      shader: unshaded
    - state: disable-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Appearance
  - type: Item
    heldPrefix: disable4
  - type: Clothing
    quickEquip: false
    sprite: Objects/Weapons/Guns/Battery/disabler.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser.ogg
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - FullAuto
  - type: MagazineVisuals
    magState: disable
    steps: 5
    zeroVisible: true
  - type: BatteryAmmoProvider
    proto: BulletDisablerSmgDouble
    fireCost: 100
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletDisablerSmgDouble
      fireCost: 100
      visualState: disable
      magState: disable
      heldPrefix: disable4
    - proto: BulletTaser
      fireCost: 142
      visualState: stun
      magState: stun
      heldPrefix: stun4
  - type: BatterySelfRecharger
    autoRechargeRate: 40

- type: entity
  name: borg temperature gun
  parent: BaseWeaponBattery
  id: WeaponTemperatureBorgGun
  description: borg temperature gun
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/temp_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-1
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/temp_gun.rsi
  - type: Gun
    fireRate: 1
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: BatteryAmmoProvider
    proto: BoltTempgunCold
    fireCost: 100
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BoltTempgunCold
      fireCost: 100
    - proto: BoltTempgunHot
      fireCost: 100
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRechargeRate: 25

- type: entity
  name: Borg M25 Phased Plasma Gun
  parent: BaseWeaponBattery
  id: FishWeaponPlasmaGunBorg
  description: M25 Phased Plasma Gun
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Battery/eg_p.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-2
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRechargeRate: 25
  - type: Gun
    fireRate: 9
    shotsPerBurst: 3
    burstFireRate: 15
    burstCooldown: 0.45
    selectedMode: Burst
    availableModes:
      - FullAuto
      - Burst
    soundGunshot:
      path: /Audio/_Sunrise/Weapons/Guns/Lasers/EG_Pistol.ogg
  - type: BatteryAmmoProvider
    proto: PlasmaBullet
    fireCost: 25

- type: entity
  id: WeaponCombatFlashbangLauncherBorg
  name: borg flashbang launcher
  description: borg flashbang launcher
  parent: BaseWeaponBattery
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
    state: mecha_grenadelnchr
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: BatteryAmmoProvider
    proto: BulletGrenadeFlashBang
    fireCost: 50
  - type: Item
    sprite: _Sunrise/Objects/Specific/Mech/mecha_inhand.rsi
  - type: BatterySelfRecharger
    autoRechargeRate: 5
  - type: Battery
    maxCharge: 250
    startingCharge: 250


