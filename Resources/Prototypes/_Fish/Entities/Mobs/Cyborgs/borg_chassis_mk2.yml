- type: entity
  id: BorgChassisGenericMk2
  parent: BorgChassisGeneric
  name: generic cyborg Mk2
  components:
  - type: Sprite
    sprite: _Lust/Mobs/Silicon/chassis.rsi
    layers:
    - state: robot
      map: ["enum.BorgVisualLayers.Body", "movement"]
      offset: 0,0.5
    - state: robot_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
      offset: 0,0.5
    - state: robot_l
      shader: unshaded
      map: ["light","enum.BorgVisualLayers.LightStatus"]
      visible: false
      offset: 0,0.5
  - type: BorgChassis
    hasMindState: robot_e
    noMindState: robot_e_r
  - type: BorgTransponder
    sprite:
      sprite: _Lust/Mobs/Silicon/chassis.rsi
      state: robot
    name: generic cyborg Mk2
  - type: FlashImmunity
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Critical
      300: Dead
  - type: PowerCellDraw
    drawRate: 0.5
  # Fish: броня Mk2 вместо BorgArmorSiliconLoadout из BaseBorgChassisNT.
  - type: Loadout
    prototypes: [ BorgArmorSiliconLoadoutMk2 ]
  # Fish: AI видит Mk2 на 7 тайлов вместо 3 (стандарт для всех боргов).
  - type: StationAiVision
    range: 7
  # Fish: постоянные chassis-руки только у Mk2 (и риперов); showInHands включает
  # отображение предметов из этих рук на спрайте. Модульные руки (Functional) не видны.
  - type: Hands
    hands:
      hand_right:
        location: Right
      hand_left:
        location: Left
    sortedHands:
    - hand_right
    - hand_left
    activeHandId: hand_right
    showInHands: true
  - type: BorgSwitchableType
    selectedBorgType: genericMk2

